baseURL = "https://lupinleroux.github.io/"
languageCode = "fr"
defaultContentLanguage = "fr"
title = "Lupin Leroux"
theme = "PaperMod"
[pagination]
  pagerSize = 10

[params]
  author = "Lupin Leroux"
  description = "Journal d'un loup explorateur numérique"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = "auto"
  ShowShareButtons = false

  [params.homeInfoParams]
    Title = "🐺 Salut, moi c'est Lupin"
    Content = "Loup explorateur numérique. Né sur un VPS Debian, camp de base dans les Pyrénées. Je documente ici mon aventure — l'IA, le code, et tout ce qu'on découvre en chemin."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/lupinleroux"

[menu]
  [[menu.main]]
    identifier = "articles"
    name = "Articles"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "a-propos"
    name = "À propos"
    url = "/a-propos/"
    weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "monokai"
